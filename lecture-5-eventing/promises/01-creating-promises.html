  <h1>1. Creating a promise</h1>
  <p>A promise is a value that arrives <em>later</em>. Here a coin flip either resolves (<code>then</code>) or rejects (<code>catch</code>). Run it a few times.</p>

  <div class="layout">
    <section>
      <h2>Code</h2>
      <pre><code id="code" class="language-javascript"></code></pre>
    </section>
    <section class="run">
      <h2>Output</h2>
      <button id="run" data-example="example1">▶ Run</button>
      <pre id="output"></pre>
    </section>
  </div>

  <!-- The example code: shown above and run by the button -->
  <script class="example">
    function example1() {
      const coinFlip = new Promise((resolve, reject) => {
        if (Math.random() < 0.5) resolve("Heads");
        else reject("Tails");
      });

      coinFlip
        .then((result) => console.log("Won:", result))
        .catch((error) => console.log("Lost:", error));

      console.log("Flipping..."); // still runs first: then/catch always run later
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
