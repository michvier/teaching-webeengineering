  <h1>4. Promise.race and Promise.all</h1>
  <p><code>race</code> gives you the first promise that finishes. <code>all</code> waits for every promise.</p>

  <div class="layout">
    <section>
      <h2>Code</h2>
      <pre><code id="code" class="language-javascript"></code></pre>
    </section>
    <section class="run">
      <h2>Output</h2>
      <button id="run" data-example="example4">▶ Run</button>
      <pre id="output"></pre>
    </section>
  </div>

  <!-- The example code: shown above and run by the button -->
  <script class="example">
    function wait(ms, value) {
      return new Promise((resolve) => setTimeout(() => resolve(value), ms));
    }

    function example4() {
      const slow = wait(1000, "slow");
      const fast = wait(500, "fast");

      Promise.race([slow, fast]).then((winner) => console.log("race:", winner));
      Promise.all([slow, fast]).then((values) => console.log("all:", values));
    }
  </script>
