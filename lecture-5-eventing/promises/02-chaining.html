  <h1>2. Chaining</h1>
  <p>Each <code>.then()</code> passes its return value to the next one. When an error is thrown, the chain skips ahead to <code>.catch()</code>.</p>

  <div class="layout">
    <section>
      <h2>Code</h2>
      <pre><code id="code" class="language-javascript"></code></pre>
    </section>
    <section class="run">
      <h2>Output</h2>
      <button id="run" data-example="example2">▶ Run</button>
      <pre id="output"></pre>
    </section>
  </div>

  <!-- The example code: shown above and run by the button -->
  <script class="example">
    function example2() {
      Promise.resolve(1)
        .then((n) => n + 1)   // 2
        .then((n) => n * 10)  // 20
        .then((n) => {
          console.log("Result:", n);
          throw new Error("Oops");
        })
        .then(() => console.log("This is skipped"))
        .catch((error) => console.log("Caught:", error.message));
    }
  </script>
