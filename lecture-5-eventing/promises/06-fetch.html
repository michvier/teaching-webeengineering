  <h1>6. fetch()</h1>
  <p><code>fetch()</code> returns a promise. Careful: a 404 does <em>not</em> throw an error! Needs an internet connection.</p>

  <div class="layout">
    <section>
      <h2>Code</h2>
      <pre><code id="code" class="language-javascript"></code></pre>
    </section>
    <section class="run">
      <h2>Output</h2>
      <button id="run" data-example="example6">▶ Run</button>
      <pre id="output"></pre>
    </section>
  </div>

  <!-- The example code: shown above and run by the button -->
  <script class="example">
    async function example6() {
      const response = await fetch("https://jsonplaceholder.typicode.com/todos/1");
      const todo = await response.json();
      console.log("Title:", todo.title);

      const missing = await fetch("https://jsonplaceholder.typicode.com/todos/99999");
      console.log("Status:", missing.status, "ok:", missing.ok); // 404, but no error!
    }
  </script>
