  <h1>7. When if / else becomes tricky</h1>
  <p>If the data is cached, the callback runs <em>now</em>. Otherwise it runs <em>later</em>. So the same code logs in a different order! Try the fix in the comment. Based on the <a href="https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide">MDN Microtask guide</a>.</p>

  <div class="layout">
    <section>
      <h2>Code</h2>
      <pre><code id="code" class="language-javascript"></code></pre>
    </section>
    <section class="run">
      <h2>Output</h2>
      <button id="run" data-example="example7">▶ Run</button>
      <pre id="output"></pre>
    </section>
  </div>

  <!-- The example code: shown above and run by the button -->
  <script class="example">
    let cached = null;

    function getData(callback) {
      if (cached) {
        callback(cached);  // runs NOW
        // Fix: queueMicrotask(() => callback(cached));
      } else {
        Promise.resolve("data").then((data) => {
          cached = data;
          callback(data);  // runs LATER
        });
      }
    }

    function example7() {
      cached = null;

      console.log("before");
      getData(() => console.log("got data"));
      console.log("after");

      setTimeout(() => {
        console.log("--- again, now cached ---");
        console.log("before");
        getData(() => console.log("got data"));
        console.log("after");
      }, 100);
    }
  </script>
